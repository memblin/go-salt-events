version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - nilerr
    - errorlint
    - contextcheck
    - durationcheck
    - copyloopvar
    - makezero
    - wastedassign
    - gosec
    - revive
    - gocritic
    - gocognit
    - misspell
    - unconvert
    - predeclared
    - goconst
    - thelper
    - tparallel
    - usetesting
    - forbidigo
    - depguard

  settings:
    gocognit:
      min-complexity: 15

    # Spec §3.2: live theme switching breaks the moment one pane hardcodes a
    # colour. That pane looks correct under the theme it was written in and
    # silently never changes with the others, so it is caught here, not by review.
    forbidigo:
      forbid:
        - pattern: 'lipgloss\.Color\('
          msg: "colour literals belong in internal/theme only (spec §3.2)"
        - pattern: 'lipgloss\.AdaptiveColor\('
          msg: "colour literals belong in internal/theme only (spec §3.2)"
        # SECONDARY check, deliberately labelled as such. The rule that
        # actually closes the hole is an API one: theme.compile is unexported,
        # so no package outside internal/theme can turn a hand-built Palette
        # into a *theme.Styles by ANY route — struct literal, zero value, or
        # mutated copy of a registered one. Two of those three contain no
        # "theme.Palette{" text, so no textual rule could ever have closed
        # them, and a rule that looks complete but is not is worse than one
        # honestly labelled. This pattern remains as a tripwire: naming the
        # type outside the registry is a sign someone is reaching for the
        # route that compile's unexporting removed, and a palette built
        # outside the registry is invisible to the contrast suite, which
        # iterates theme.Names(). Styles are obtained via theme.StylesFor.
        - pattern: 'theme\.Palette'
          msg: "build palettes only in internal/theme; get styles with theme.StylesFor (spec §3.2)"

    # Spec §3.1, enforced rather than documented.
    depguard:
      rules:
        ui-must-not-import-ingest:
          files:
            - "**/internal/ui/**"
          deny:
            - pkg: github.com/TKC-Labs/go-salt-events/internal/saltipc
              desc: "the UI must not import the ingest layer; it reads snapshots (spec §3.1)"
            - pkg: github.com/vmihailenco/msgpack/v5
              desc: "the UI must never decode wire format (spec §3.1)"

        # Deny-by-default, then carve out the three places a TUI import is
        # legitimate. The earlier form enumerated the seven ingest packages by
        # path, which is fail-OPEN: internal/export was added later, matched no
        # pattern, and silently escaped the layer rule entirely — it complied by
        # luck, not by enforcement, and every future non-UI package would have
        # inherited the same hole. This project enforces structurally rather
        # than by convention, and a rule that looks complete but is not is worse
        # than one honestly labelled.
        ingest-must-not-import-tui:
          files:
            - "$all"
            - "!**/internal/ui/**"
            - "!**/internal/theme/**"
            - "!**/cmd/**"
          deny:
            - pkg: github.com/charmbracelet/bubbletea
              desc: "the ingest layer must not import bubbletea (spec §3.1)"
            - pkg: github.com/charmbracelet/lipgloss
              desc: "the ingest layer must not import lipgloss (spec §3.1)"
            - pkg: github.com/charmbracelet/bubbles
              desc: "the ingest layer must not import bubbles (spec §3.1)"

  exclusions:
    rules:
      - path: 'internal/theme/'
        linters:
          - forbidigo
      - path: 'internal/theme/registry\.go'
        linters:
          - goconst
      - path: '_test\.go'
        linters:
          - gosec
          - goconst
          - gocognit
